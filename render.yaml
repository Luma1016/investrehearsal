# Render 상시 백엔드 (Express + SQLite + 시세루프) - Blueprint
# 사용: Render Dashboard > New > Blueprint > 이 저장소 선택
# 주의: 무료 플랜은 비활성 시 슬립(24시간 상시 아님). 진짜 24시간 + DB 유지는 Starter 이상 + Disk 필요.
services:
  - type: web
    name: invest-rehearsal-api
    runtime: node
    plan: free # 24시간 상시+영속DB는 starter 이상 권장
    buildCommand: npm ci # node_modules 싹 지우고 재설치 → Node 버전 바뀔 때 better-sqlite3 네이티브 꼬임 방지
    startCommand: node src/server.js
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: SESSION_SECRET
        generateValue: true
      # Supabase 백업 (A안): 아래 2개만 넣으면 DB 영속화. 버킷은 자동 생성.
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_SERVICE_KEY
      #   sync: false
      # - key: BACKUP_INTERVAL_MIN
      #   value: 5
      # 영속 디스크(유료 플랜) 사용 시 주석 해제 + DB_PATH를 마운트 경로로 지정
      # - key: DB_PATH
      #   value: /var/data/db.sqlite
    # disk:
    #   name: sqlite-data
    #   mountPath: /var/data
    #   sizeGB: 1
