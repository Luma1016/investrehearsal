<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - 모의스톡 MY</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>모의스톡 <span>MY</span></h1>
    <p class="sub">로그인 후 MY 홈으로 이동합니다</p>
    <div class="err" id="err"></div>
    <label>이메일</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="username">
    <label>비밀번호</label>
    <input id="pw" type="password" placeholder="4자 이상" autocomplete="current-password">
    <button class="btn" id="loginBtn">로그인</button>
    <button class="btn-ghost" onclick="location.href='/signup.html'">회원가입</button>
    <p class="caption">테스트 관리자: admin@invest.local</p>
  </div>
</div>
<script src="/app.js"></script>
<script>
const $ = (id) => document.getElementById(id);
(async () => {
  try {
    const r = await fetch('/api/health', { credentials: 'include' });
    if (!r.ok) throw new Error();
  } catch (e) {
    const el = $('err');
    el.textContent = '서버(API)에 연결할 수 없습니다. 백엔드 배포 상태와 netlify.toml의 프록시 주소를 확인해 주세요.';
    el.style.display = 'block';
  }
})();
async function login() {
  $('err').style.display = 'none';
  try {
    await api('/api/auth/login', 'POST', { email: $('email').value.trim(), pw: $('pw').value });
    location.href = '/dashboard.html';
  } catch (e) { const el = $('err'); el.textContent = '로그인 실패: ' + e.message; el.style.display = 'block'; }
}
$('loginBtn').onclick = login;
$('pw').onkeydown = (e) => { if (e.key === 'Enter') login(); };
</script>
</body>
</html>
