<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오 - 모의스톡 MY</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="logo">모의스톡 <span>MY</span></div>
    <div class="nav">
      <a href="/dashboard.html">◉ MY 홈</a>
      <a href="/board.html">♡ 피드</a>
      <a href="/stocks.html">▦ 종목 탐색</a>
      <a href="/challenge.html">🏆 챌린지</a>
      <small>MENU</small>
      <a class="on" href="/portfolio.html">📊 포트폴리오</a>
      <a href="/history.html">🧾 거래내역</a>
      <a href="#" id="logout">⚙ 로그아웃</a>
    </div>
  </aside>
  <main class="main">
    <div class="kpis">
      <div class="kpi"><span>총자산</span><b id="kTotal">-</b><small id="kProfit">-</small></div>
      <div class="kpi"><span>주식 평가액</span><b id="kStock">-</b><small id="kCount">-</small></div>
      <div class="kpi"><span>예수금</span><b id="kCash">-</b><small>주문 가능</small></div>
      <div class="kpi"><span>수익률</span><b id="kRate">-</b><small>초기금 대비</small></div>
    </div>
    <div class="panel"><h2>자산 추이 · 하루 1회 스냅샷</h2><svg id="chart" viewBox="0 0 700 180" style="width:100%;height:180px;margin-top:12px"></svg></div>
    <div class="panel"><h2>보유 종목</h2><table><tr><th>종목</th><th>보유수량</th><th>평균단가</th><th>현재가</th><th>손익</th><th></th></tr><tbody id="rows"></tbody></table></div>
  </main>
  <div class="rail"><div class="mini"><h3>안내</h3><p style="font-size:12.5px;color:var(--muted)">손익 = (현재가-평단)×수량 · 차트는 자산 스냅샷 기준</p></div></div>
</div>
<script src="/app.js"></script>
<script>
function draw(points) {
  const el = document.getElementById('chart');
  if (!points.length) { el.innerHTML = '<text x="10" y="90" fill="#9CA3AF" font-size="13">데이터 없음</text>'; return; }
  const max = Math.max(...points), min = Math.min(...points), rg = (max - min) || 1;
  const xy = points.map((v, i) => [i / (points.length - 1 || 1) * 700, 160 - (v - min) / rg * 130]);
  const line = xy.map(p => p.join(',')).join(' ');
  const area = `0,180 ${line} 700,180`;
  el.innerHTML = `<line x1="0" y1="45" x2="700" y2="45" stroke="#EEF0F3"/><line x1="0" y1="90" x2="700" y2="90" stroke="#EEF0F3"/><line x1="0" y1="135" x2="700" y2="135" stroke="#EEF0F3"/><polygon points="${area}" fill="#4F46E5" opacity="0.12"/><polyline points="${line}" fill="none" stroke="#4F46E5" stroke-width="2.5"/>`;
}
(async () => {
  const p = await api('/api/portfolio');
  document.getElementById('kTotal').textContent = fmt(p.total);
  document.getElementById('kStock').textContent = fmt(p.stockVal);
  document.getElementById('kCash').textContent = fmt(p.cash);
  const pr = `${p.profit >= 0 ? '+' : ''}${fmt(p.profit).replace('원','')}원 (${(p.rate * 100).toFixed(1)}%)`;
  const kp = document.getElementById('kProfit'); kp.textContent = pr; kp.className = p.profit >= 0 ? 'g' : 'r';
  document.getElementById('kRate').textContent = (p.rate * 100).toFixed(2) + '%';
  document.getElementById('kCount').textContent = p.items.length + '종목 보유';
  document.getElementById('rows').innerHTML = p.items.map(i => `<tr class="rowlink" data-c="${i.code}"><td><b>${i.name}</b></td><td>${i.qty}주</td><td>${fmt(i.avg)}</td><td>${fmt(i.cur)}</td><td><span class="pill ${i.pnl >= 0 ? 'p-green' : 'p-red'}">${i.pnl >= 0 ? '+' : ''}${i.pnl.toLocaleString()}원 (${(i.rate * 100).toFixed(1)}%)</span></td><td><button class="follow-btn">차트</button></td></tr>`).join('') || '<tr><td colspan=6 style="color:var(--muted)">보유 종목 없음</td></tr>';
  document.querySelectorAll('tr.rowlink').forEach(tr => tr.onclick = () => location.href = '/stock.html?code=' + tr.dataset.c);
  const a = await api('/api/assets');
  draw(a.map(x => x.total));
})();
document.getElementById('logout').onclick = async (e) => { e.preventDefault(); await api('/api/auth/logout', 'POST'); location.href = '/login.html'; };
</script>
</body>
</html>
