<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>종목 탐색 - 모의스톡 MY</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="logo">모의스톡 <span>MY</span></div>
    <div class="nav">
      <a href="/dashboard.html">◉ MY 홈</a>
      <a href="/board.html">♡ 피드</a>
      <a class="on" href="/stocks.html">▦ 종목 탐색</a>
      <a href="/dashboard.html">🏆 챌린지</a>
      <small>MENU</small>
      <a href="/portfolio.html">📊 포트폴리오</a>
      <a href="/history.html">🧾 거래내역</a>
      <a href="#" id="logout">⚙ 로그아웃</a>
    </div>
  </aside>
  <main class="main">
    <div class="panel">
      <h2>종목 탐색 · 가상시세 (1분 갱신)</h2>
      <div class="search"><input id="q" placeholder="종목명 또는 코드 검색"><button class="follow-btn" id="btn">검색</button></div>
      <table><tr><th>종목</th><th>현재가</th><th>상태</th><th></th></tr><tbody id="rows"></tbody></table>
    </div>
  </main>
  <div class="rail"><div class="mini"><h3>안내</h3><p style="font-size:12.5px;color:var(--muted)">시장가 단일가 · 수수료 0원 · 정지 종목 거래 차단</p></div><p class="note">기본 화면 = MY 홈 · 수수료 0원 · 시장가 단일가</p></div>
</div>
<script src="/app.js"></script>
<script>
const rows = document.getElementById('rows');
async function load() {
  const q = document.getElementById('q').value.trim();
  const list = await api('/api/stocks' + (q ? '?q=' + encodeURIComponent(q) : ''));
  rows.innerHTML = list.map(s => `<tr class="rowlink" data-c="${s.code}"><td><b>${s.name}</b> <span style="color:var(--muted);font-size:12px">${s.code}</span></td><td>${fmt(s.cur_price)}</td><td>${s.status === '정지' ? '<span class="pill p-up">정지</span>' : '<span class="pill p-gray">정상</span>'}</td><td><button class="follow-btn">상세</button></td></tr>`).join('') || '<tr><td colspan=4 style="color:var(--muted)">결과 없음</td></tr>';
  rows.querySelectorAll('tr.rowlink').forEach(tr => tr.onclick = () => location.href = '/stock.html?code=' + tr.dataset.c);
}
document.getElementById('btn').onclick = load;
document.getElementById('q').onkeydown = (e) => { if (e.key === 'Enter') load(); };
document.getElementById('logout').onclick = async (e) => { e.preventDefault(); await api('/api/auth/logout', 'POST'); location.href = '/login.html'; };
load();
</script>
</body>
</html>
